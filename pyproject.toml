[project]
name = "dora-bot"
version = "0.1.0"
description = "Dora maintainer QQ bot helpers for NcatBot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "ncatbot5>=5.0.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
dora-bot = "dora_ops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dora_ops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
